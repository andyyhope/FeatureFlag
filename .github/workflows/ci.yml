name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  documentation:
    name: Documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Warnings here are broken links and undocumented parameters — the things that
      # make published documentation quietly wrong.
      - name: Build documentation
        run: |
          swift package generate-documentation \
            --target FeatureFlag \
            --target FeatureFlagUI \
            --warnings-as-errors

  platforms:
    name: Build ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: FeatureFlag-Package
            destination: generic/platform=iOS Simulator
          - name: tvOS
            scheme: FeatureFlag-Package
            destination: generic/platform=tvOS Simulator
          # The core supports watchOS; FeatureFlagUI deliberately compiles to nothing
          # there, since a watch has no Menu, TextEditor or bordered text field.
          - name: watchOS
            scheme: FeatureFlag
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -quiet

  examples:
    name: Example apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DemoApp
        working-directory: Examples
        run: |
          xcodebuild build \
            -project FeatureFlagExamples.xcodeproj \
            -scheme DemoApp \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Build DemoCompanion
        working-directory: Examples
        run: |
          xcodebuild build \
            -project FeatureFlagExamples.xcodeproj \
            -scheme DemoCompanion \
            -destination 'generic/platform=iOS Simulator' \
            -quiet
